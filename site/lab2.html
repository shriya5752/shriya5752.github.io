<body class="dream">
  <div id="screen">
    <div class="sky" aria-hidden="true">
      <i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i><i class="cloud c4"></i>
    </div>

    <header class="nav">

    <main id="desktop">
      <section class="dhero">
        <p class="deyebrow">WELCOME TO MY CORNER</p>

        <p class="dsub">overthinker &middot; tinkerer &middot; cs student</p>

    <div class="status r">double-click to open &middot; drag to move</div>
  </div>
