<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #F5F1E8, #E8E2D5);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body>
    {{ block "main" . }}{{ end }}

    <!-- no-notes modal -->
    <div id="no-notes-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:9999; align-items:center; justify-content:center;">
      <div style="background:#fff; border-radius:16px; padding:2.5rem 2rem; max-width:420px; width:90%; text-align:center; box-shadow:0 8px 40px rgba(0,0,0,0.12); position:relative;">
        <div style="font-size:2.5rem; margin-bottom:0.75rem;">📭</div>
        <h3 style="font-family:'Playfair Display', serif; color:#5a2d0c; font-size:1.4rem; margin:0 0 0.5rem;">uh oh, no notes here!</h3>
        <p style="color:#888; font-size:0.95rem; line-height:1.6; margin:0 0 1.5rem;">
          i haven't uploaded notes for this sem since they were all handwritten, check out the other semesters, they're stocked.
        </p>
        <button
          onclick="document.getElementById('no-notes-modal').style.display='none'"
          style="background:#7a3b10; color:#fff; border:none; border-radius:999px; padding:0.65rem 1.75rem; font-size:0.9rem; cursor:pointer; font-family:inherit;">
          got it →
        </button>
      </div>
    </div>

    <script>
      document.getElementById('no-notes-modal').addEventListener('click', function(e) {
        if (e.target === this) this.style.display = 'none';
      });
    </script>

</body>
</html>
