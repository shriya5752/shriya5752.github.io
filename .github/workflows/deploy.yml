name: Deploy to GitHub Pages

# Optional: only needed if you host on GitHub Pages instead of Vercel.
# The site is plain static files in the site/ folder, so there is nothing to compile.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Refresh posts/notes from your files. If this ever fails, the last good
      # content that is already committed in site/ is published instead.
      - name: Rebuild content
        continue-on-error: true
        run: |
          pip install markdown pyyaml
          python scripts/build_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
